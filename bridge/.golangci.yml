# golangci-lint v2. Run from bridge/: golangci-lint run ./...
version: "2"
linters:
  default: standard
  enable:
    - revive
    - godot
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: comment-spacings
    godot:
      scope: declarations
      period: true
